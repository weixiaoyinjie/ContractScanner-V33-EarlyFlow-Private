
name: Build V33 Android APK (fixed SDK)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V33 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="ContractScanner_V33_EarlyFlow_Independent_DailyK.zip"
          test -f "$ZIP" || { echo "::error::Upload $ZIP to the repository root first"; exit 1; }
          mkdir -p source
          unzip -q "$ZIP" -d source
          test -f source/settings.gradle
          test -f source/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -f "$SDK/platforms/android-35/android.jar"
          test -f "$SDK/build-tools/35.0.0/aapt"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run source tests
        working-directory: source
        run: |
          node tests/core.test.js
          node tests/minute.test.js
          node tests/quick-nav.test.js
          node tests/engine-v33.test.js
          node tests/ui-regression.test.js

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: V33-EarlyFlow-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
